<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Voxel Pagoda Garden</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; }
  #err { position: fixed; top: 8px; left: 8px; right: 8px; background: #b91c1c; color: #fff;
         font: 13px monospace; padding: 8px 12px; border-radius: 6px; display: none;
         white-space: pre-wrap; z-index: 10; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- FIXED CHASSIS (do not modify) ----------
const errBox = document.getElementById('err');
function showErr(msg) { errBox.style.display = 'block'; errBox.textContent += msg + '\n'; }
window.onerror = (m, s, l) => showErr(`Error: ${m} (line ${l})`);
window.onunhandledrejection = e => showErr(`Rejection: ${e.reason}`);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 90, 220);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(42, 34, 42);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10, 0);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.AmbientLight(0xb9c2ff, 0.55));
const sun = new THREE.DirectionalLight(0xffe0b3, 1.15);
sun.position.set(60, 90, 35); sun.castShadow = true; scene.add(sun);

const _geo = new THREE.BoxGeometry(1, 1, 1);
const _mats = new Map();
const MAX_VOXELS = 60000; let _count = 0;
function addVoxel(x, y, z, color, sx = 1, sy = 1, sz = 1) {
  if (_count >= MAX_VOXELS) return;
  _count++;
  let m = _mats.get(color);
  if (!m) { m = new THREE.MeshLambertMaterial({ color }); _mats.set(color, m); }
  const v = new THREE.Mesh(_geo, m);
  v.position.set(x, y, z); v.scale.set(sx, sy, sz);
  v.castShadow = v.receiveShadow = true;
  scene.add(v);
}
function section(name, fn) {
  try { fn(); console.log(`section ok: ${name}`); }
  catch (e) { showErr(`section "${name}" failed: ${e.message}`); }
}
// RENDER LOOP STARTS BEFORE SCENE BUILD — a broken section can never blank the page.
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
// ---------- END CHASSIS ----------

// ---------- SCENE (model fills ONLY this part, using section() + addVoxel()) ----------
section('demo', () => {
  for (let i = 0; i < 5; i++) addVoxel(i * 2 - 4, 0.5, 0, 0xff5577);
  addVoxel(0, 2, 0, 0x55ff77); addVoxel(0, 3, 0, 0x5577ff);
});
// ---------- END SCENE ----------
</script>
</body>
</html>
